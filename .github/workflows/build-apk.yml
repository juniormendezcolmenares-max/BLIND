name: BLIND Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar proyecto Android
        run: |
          unzip -q BLIND_Android_Phone_V1.0.zip -d android-project

      - name: Compilar APK
        working-directory: android-project/blind-android
        run: |
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: BLIND-APK
          path: android-project/blind-android/app/build/outputs/apk/debug/app-debug.apk
